<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7f2"><meta name="description" content="Explore the art of ratios. Make, understand, and export beautiful Spirograph geometry."><title>Spiro Craft</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<main>
<div class="workbench">
<aside class="controls">
<div class="panel-brand"><a class="brand" href="./" aria-label="Spiro Craft"><img src="icon.svg" alt="" width="34" height="34"><img class="brand-wordmark" src="public/brand/wordmark.svg" alt="Spiro Craft"></a><button id="randomize" class="button shuffle" aria-label="Surprise me">⤨ <span>Surprise me</span></button></div>
<div class="section-heading"><h2><img class="menu-title" src="public/brand/menu-geometry.svg" alt="Geometry"></h2><button id="reset" class="text-button">Reset ↺</button></div>
<div class="segmented" aria-label="Geometry mode"><button class="active" data-mode="guided">Symmetry</button><button data-mode="free">Freeform</button></div>
<div id="guided-controls"><label class="label">BASE RATIO</label><div class="presets"><button data-fold="6"><b>6</b><span>Simple</span><svg class="mini" data-mini="6" viewBox="-105 -105 210 210"></svg></button><button class="active" data-fold="12"><b>12</b><span>Balanced</span><svg class="mini" data-mini="12" viewBox="-105 -105 210 210"></svg></button><button data-fold="24"><b>24</b><span>Intricate</span><svg class="mini" data-mini="24" viewBox="-105 -105 210 210"></svg></button></div><div class="control"><div class="control-title"><label for="winding">Winding</label><span id="winding-value" class="precision-mount"></span></div><input id="winding" type="range" min="1" max="11" step="1"></div></div>
<div id="free-controls" hidden><div class="control"><div class="control-title"><label for="outer">Fixed gear · R</label><span id="outer-value" class="precision-mount"></span></div><input id="outer" type="range" min="25" max="240" step="1"></div><div class="control"><div class="control-title"><label for="inner">Rolling gear · r</label><span id="inner-value" class="precision-mount"></span></div><input id="inner" type="range" min="5" max="120" step="1"></div><label class="label" for="curve">ROLLING DIRECTION</label><select id="curve"><option value="inside">Inside · hypotrochoid</option><option value="outside">Outside · epitrochoid</option></select></div>
<div class="control"><div class="control-title"><label for="offset">Pen offset</label><span id="offset-value" class="precision-mount"></span></div><input id="offset" type="range" min="0" max="220" step="1"></div>
<div class="toggle-row"><label for="guides">Show construction guides</label><input id="guides" type="checkbox" role="switch"></div><div id="layers-panel"></div>
</aside>
<section class="studio" aria-label="Geometry preview"><div class="canvas-toolbar"><div class="mobile-brand"><a class="brand" href="./" aria-label="Spiro Craft"><img src="icon.svg" alt="" width="34" height="34"><img class="brand-wordmark" src="public/brand/wordmark.svg" alt="Spiro Craft"></a><button id="mobile-randomize" class="text-button" aria-label="Surprise me">⤨</button></div><span class="canvas-title"><span class="dot"></span> LIVE CANVAS</span><div class="view-tools"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" title="Reset zoom">100%</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div><div class="drawing-wrap"><svg id="drawing" viewBox="-500 -500 1000 1000" role="img" aria-label="Live Spirograph geometry"><defs><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1" fill="#d8d6ce"/></pattern></defs><defs id="ink-texture"></defs><rect x="-1500" y="-1500" width="3000" height="3000" fill="url(#dots)"/><g id="art"><g id="layer-art"><path id="geometry"/></g><g id="guide-layer"></g></g></svg><div id="canvas-ratio" class="canvas-signature"></div><div class="canvas-axis">+<span>0, 0</span></div></div><div class="canvas-bottom"><div><span class="status-dot"></span><span id="pattern-status">Closed path</span><span class="divider">/</span><span id="point-count"></span></div><button id="animate" class="text-button">▷ Trace the pattern</button></div></section>
<aside class="insights"><div class="appearance-controls">
<div class="section-heading"><h2><img class="menu-title" src="public/brand/menu-appearance.svg" alt="Appearance"></h2></div>
<div class="control"><div class="control-title"><label for="size">Drawing size</label><span id="size-value" class="precision-mount"></span></div><input id="size" type="range" min="30" max="94" step="1"></div>
<div class="control"><div class="control-title"><label for="stroke">Line weight</label><span id="stroke-value" class="precision-mount"></span></div><input id="stroke" type="range" min="0.3" max="5" step="0.1"></div>
<div class="control"><div class="control-title"><label for="rotation">Rotation</label><span id="rotation-value" class="precision-mount"></span></div><input id="rotation" type="range" min="0" max="360" step="1"></div><div class="control"><div class="control-title"><label for="opacity">Opacity</label><span id="opacity-value" class="precision-mount"></span></div><input id="opacity" type="range" min="0" max="100" step="1"></div><div class="section-heading"><h2><img class="menu-title" src="public/brand/menu-ink.svg" alt="Ink"></h2></div><div class="swatches"><button data-color="#c92e32" class="active" style="--swatch:#c92e32" aria-label="Red" title="Red"></button><button data-color="#167447" style="--swatch:#167447" aria-label="Green" title="Green"></button><button data-color="#2356b2" style="--swatch:#2356b2" aria-label="Blue" title="Blue"></button><button data-color="#202124" style="--swatch:#202124" aria-label="Black" title="Black"></button><label class="custom-color" title="Custom ink color">+<input id="custom-color" type="color" value="#c92e32" aria-label="Custom ink color"></label></div>

<div class="paper-section"><div class="section-heading"><h2><img class="menu-title" src="public/brand/menu-paper.svg" alt="Paper"></h2></div><div class="toggle-row"><label for="paperGrain">Paper tooth <span class="paper-scope">All layers</span></label><input id="paperGrain" type="checkbox" role="switch"></div><div id="paper-options" hidden><label class="label" for="paper">PAPER FINISH</label><select id="paper"><option value="hot-press">Hot press · Smooth</option><option value="cold-press" selected>Cold press · Medium</option><option value="rough">Rough · Coarse</option></select><div class="control"><div class="control-title"><label for="grainAmount">Grain strength</label><span id="grainAmount-value" class="precision-mount"></span></div><input id="grainAmount" type="range" min="0" max="100" step="1"></div></div><div id="ink-blend-panel"></div></div>
</div><div id="export-panel"></div></aside>
</div>
<div id="mobile-editor"></div>
<input id="load-file" type="file" accept="application/json,.json" hidden>
</main><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script>
</body></html>
